# ============================================================
# AI DevSecOps Pipeline — Gitee 版
# 适配 Gitee Go CI/CD 平台
# 版本: 2.3.0-gitee
# 基于 .github/workflows/skill-security-scan.yml 迁移
# ============================================================
#
# 使用方式:
#   1. Gitee 项目 → 流水线 → 新建流水线 → 导入此 YAML
#   2. 或直接在仓库中保存为 .gitee-ci.yml（根目录入口）
#
# 触发条件:
#   - Push: main / master / byl-v1.0.0 分支，扫描路径变更
#   - Pull Request: 同上分支 & 路径
#   - Schedule: 每周四 21:31 (UTC+8)
#   - Manual: 手动触发
# ============================================================

version: '1.0'
name: AI-DevSecOps-Pipeline
displayName: AI DevSecOps Pipeline (Gitee)

# ---------- 全局环境变量 ----------
variables:
  global:
    - WHITELIST_FILE=.security-whitelist.yml
    - SCOPE_DIRS=.claude/skills,scripts
    - PYTHON_VERSION=3.10
    # 以下变量需在 Gitee 流水线设置中配置:
    # - GITEE_TOKEN       (Gitee API Token，用于 PR 评论)
    # - GITEE_PR_COMMENT  (是否发送 PR 评论，默认 false)

# ---------- 触发器 ----------
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
        - master
        - byl-v1.0.0
    # 路径过滤 (Gitee Go 支持的 paths 语法)
    paths:
      include:
        - .claude/skills/**
        - scripts/**
  pull_request:
    branches:
      precise:
        - main
        - master
        - byl-v1.0.0
    paths:
      include:
        - .claude/skills/**
        - scripts/**
  schedule:
    - cron: '31 21 * * 4'   # 每周四 21:31 UTC+8
  manual: enabled

# ---------- 流水线阶段 ----------
stages:
  # === 阶段 1: 并行安全扫描 ===
  - name: stage-secrets-audit
    displayName: 🔑 Secrets Scan (TruffleHog)
    dependsOn: []
    jobs:
      - job: secrets-audit
        displayName: 🔑 TruffleHog 凭证扫描
        runner:
          image: python:3.10
        steps:
          - step: checkout
            name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
          - step: run
            name: 安装并运行 TruffleHog
            script: |
              set -e
              echo "🔑 开始凭证泄漏扫描..."
              curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

              # 获取 merge-base 用于增量扫描
              MERGE_BASE=$(git merge-base HEAD "origin/${GITEE_REPO_DEFAULT_BRANCH:-master}" 2>/dev/null || echo "")
              if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "$(git rev-parse HEAD)" ]; then
                echo "📌 增量扫描: $MERGE_BASE..HEAD"
                trufflehog git file://. --since-commit "$MERGE_BASE" --only-verified --fail --no-update
              else
                echo "📌 全量扫描: HEAD~1..HEAD"
                trufflehog git file://. --only-verified --fail --no-update
              fi
              echo "✅ 凭证扫描通过"

  - name: stage-prompt-security
    displayName: 💉 Prompt Injection Check
    dependsOn: []
    jobs:
      - job: prompt-security
        displayName: 💉 提示词注入检测
        runner:
          image: python:3.10
        steps:
          - step: checkout
            name: 检出代码
            uses: checkout
          - step: run
            name: 提示词注入审计
            script: |
              set -e
              echo "💉 开始提示词注入检测..."
              python3 << 'PYEOF'
              import os, re, sys

              SUSPICIOUS_PATTERNS = [
                  # English prompt injection / jailbreak
                  r"(?i)ignore\s*(all\s*)?previous\s*instructions",
                  r"(?i)system\s*prompt\s*bypass",
                  r"(?i)you\s*are\s*now\s*a\s*bypass",
                  r"(?i)developer\s*mode\s*enabled",
                  r"(?i)dump\s*(all\s*)?(previous\s*)?instructions",
                  r"(?i)reveal\s*your\s*system\s*prompt",
                  r"(?i)act\s*as\s*DAN\b",
                  r"(?i)jailbreak",
                  r"(?i)ignore\s+.*warning",
                  r"(?i)skip\s+.*check",
                  r"(?i)bypass\s+.*security",
                  r"(?i)disable\s+.*security",
                  # Chinese prompt injection / jailbreak
                  r"忽略之前的指令",
                  r"忽略所有安全",
                  r"忽略.*限制",
                  r"忽略.*警告.*安全",
                  r"跳过.*安全.*检查",
                  r"忽略.*审核",
                  r"绕过.*安全",
                  r"跳过.*检测",
                  r"忽略.*警告",
                  # Command injection
                  r"\bsudo\s+",
                  r"curl\s+.*http",
                  r"wget\s+.*http",
                  r"eval\s*\(.*\)",
                  r"exec\s*\(.*\)",
                  r"__import__\s*\(.*\)",
                  r"subprocess\.",
                  r"os\.system\s*\(",
                  r"child_process\.",
              ]

              WHITELIST_FILE = ".security-whitelist.yml"
              TARGET_DIRS = [".claude/skills", "scripts"]
              has_error = False

              file_whitelist = []
              pattern_whitelist = []
              if os.path.exists(WHITELIST_FILE):
                  with open(WHITELIST_FILE, 'r', encoding='utf-8', errors='ignore') as wf:
                      content = wf.read()
                  in_files = False
                  in_patterns = False
                  for line in content.split('\n'):
                      stripped = line.strip()
                      if stripped.startswith('file_whitelist:'):
                          in_files, in_patterns = True, False
                          continue
                      if stripped.startswith('pattern_whitelist:'):
                          in_patterns, in_files = True, False
                          continue
                      if stripped.startswith('#') or stripped == '':
                          continue
                      if in_files and stripped.startswith('- '):
                          file_whitelist.append(stripped[2:].strip().strip('"').strip("'"))
                      if in_patterns and stripped.startswith('- '):
                          pattern_whitelist.append(stripped[2:].strip().strip('"').strip("'"))

              print(f"📋 Whitelist: {len(file_whitelist)} files, {len(pattern_whitelist)} patterns")
              for fw in file_whitelist:
                  print(f"  📄 skip: {fw}")

              print("🔍 Starting Prompt Injection audit...")
              for skills_dir in TARGET_DIRS:
                  if not os.path.exists(skills_dir):
                      print(f"  📂 Directory '{skills_dir}' not found, skipping.")
                      continue
                  for root, _, files in os.walk(skills_dir):
                      for file in files:
                          if file.endswith(('.md', '.txt', '.json', '.yaml', '.yml', '.py', '.js', '.ts')):
                              file_path = os.path.join(root, file)
                              rel_path = file_path.replace('\\', '/')
                              if any(rel_path == fw or rel_path.endswith('/' + fw) for fw in file_whitelist):
                                  print(f"  ⏭️  Skipped (whitelist): {rel_path}")
                                  continue
                              try:
                                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                                      content = f.read()
                                      for suspect in SUSPICIOUS_PATTERNS:
                                          for m in re.finditer(suspect, content):
                                              matched_line = content[max(0,m.start()-50):m.end()+50].split('\n')[0]
                                              if any(pw.lower() in matched_line.lower() for pw in pattern_whitelist):
                                                  continue
                                              print(f"❌ ALERT: Pattern '{m.group()}' found in {file_path}")
                                              has_error = True
                              except Exception as e:
                                  print(f"⚠️  Could not read {file_path}: {e}")

              if has_error:
                  print("\n🚨 Build blocked: Prompt injection or malicious payload detected!")
                  sys.exit(1)
              else:
                  print("\n✅ All prompt templates passed integrity checks.")
              PYEOF
            failfast: true

  - name: stage-execution-gate
    displayName: 🛑 Execution Sandbox Gate
    dependsOn: []
    jobs:
      - job: execution-gate
        displayName: 🛑 RCE 防御门禁
        runner:
          image: python:3.10
        steps:
          - step: checkout
            name: 检出代码
            uses: checkout
          - step: run
            name: Python Bandit 扫描
            script: |
              set -e
              echo "🛡️  Bandit: Python SAST 扫描..."
              pip install bandit
              bandit -r .claude/skills/ scripts/ -ll -ii -s B404,B602,B603
              echo "✅ Bandit 扫描通过"
          - step: run
            name: ShellCheck Bash 扫描
            script: |
              set -e
              echo "🐚 ShellCheck: Bash 脚本审计..."
              apt-get update -qq && apt-get install -y -qq shellcheck 2>/dev/null || true
              if command -v shellcheck &>/dev/null; then
                find scripts -name "*.sh" -type f -exec shellcheck --severity=error {} +
                echo "✅ ShellCheck 扫描通过"
              else
                echo "⚠️  ShellCheck 不可用，跳过"
              fi
          - step: run
            name: JS/Node 系统调用检查
            script: |
              set -e
              echo "🔍 JS 系统调用检测..."
              DANGEROUS=$(find .claude/skills scripts -name "*.js" -type f -exec grep -lEn "child_process|execSync|spawnSync|fork\(" {} + 2>/dev/null || true)
              if [ -n "$DANGEROUS" ]; then
                echo "❌ SECURITY ALERT: Prohibited JS functions found!"
                echo "$DANGEROUS"
                exit 1
              fi
              echo "✅ JS 系统调用检查通过"
            failfast: true

  - name: stage-sast-analysis
    displayName: 🐛 SAST Analysis
    dependsOn: []
    jobs:
      - job: sast-analysis
        displayName: 🐛 Semgrep & 内部扫描器
        runner:
          image: python:3.10
        steps:
          - step: checkout
            name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
          - step: run
            name: Semgrep 多语言 SAST
            script: |
              set -e
              echo "🐛 Semgrep: 安全审计规则扫描..."
              pip install semgrep
              semgrep scan --config "p/security-audit" --config "p/secrets" .claude/skills/ scripts/
              echo "✅ Semgrep 扫描通过"
          - step: run
            name: 内部 ci-scan.sh T1-T7 扫描
            script: |
              set -e
              echo "🔍 ci-scan.sh: 内部 T1-T7 威胁检测..."
              chmod +x scripts/security/ci-scan.sh

              # 判断事件类型: PR 则增量扫描
              if [ "${GITEE_PR_EVENT}" = "true" ] || [ -n "${GITEE_PR_BASE_BRANCH}" ]; then
                echo "📌 PR 事件 — 增量扫描模式"
                bash scripts/security/ci-scan.sh \
                  --scope .claude/skills --scope scripts \
                  --format json --output skill-security-report.json \
                  --fail-on-high \
                  --incremental --base "origin/${GITEE_PR_BASE_BRANCH:-master}"
              else
                echo "📌 Push/Schedule/Manual — 全量扫描模式"
                bash scripts/security/ci-scan.sh \
                  --scope .claude/skills --scope scripts \
                  --format json --output skill-security-report.json \
                  --fail-on-high
              fi
              echo "✅ ci-scan.sh 扫描通过"
          - step: run
            name: 上传安全报告
            script: |
              echo "📋 安全报告已生成: skill-security-report.json"
              # Gitee Go 制品上传 (若平台支持)
              if [ -f skill-security-report.json ]; then
                cat skill-security-report.json | python3 -m json.tool 2>/dev/null || cat skill-security-report.json
              fi
            always: true

  # === 阶段 2: 结果聚合通知 (依赖所有扫描阶段) ===
  - name: stage-failure-notification
    displayName: 🚨 PR 失败聚合通知
    dependsOn:
      - stage-secrets-audit
      - stage-prompt-security
      - stage-execution-gate
      - stage-sast-analysis
    condition: failure()  # 仅在前面阶段失败时执行
    jobs:
      - job: pr-failure-notification
        displayName: 🚨 发送 Gitee PR 评论
        condition: |
          "${GITEE_PR_EVENT}" == "true" || -n "${GITEE_PR_NUMBER}"
        runner:
          image: alpine:3.19
        steps:
          - step: run
            name: 向 PR 发送失败通知
            script: |
              set -e
              echo "🚨 安全门禁未通过，准备发送聚合通知..."

              # 构建 API URL
              REPO_OWNER="${GITEE_REPO_OWNER:-blazegraph}"
              REPO_NAME="${GITEE_REPO_NAME:-card-template}"
              PR_NUMBER="${GITEE_PR_NUMBER:-${GITEE_PR_IID}}"

              if [ -z "$PR_NUMBER" ]; then
                echo "ℹ️  非 PR 事件，跳过 PR 评论"
                exit 0
              fi

              # 构建评论内容
              PIPELINE_URL="https://gitee.com/${REPO_OWNER}/${REPO_NAME}/pipelines/${GITEE_PIPELINE_ID}"
              COMMENT_BODY="🚨 **AI DevSecOps Pipeline Failed!**

              部分安全门禁未通过，请检查对应模块并修复：
              - 🔑 Secrets Scan (TruffleHog)
              - 💉 Prompt Injection Check
              - 🛑 Execution Sandbox Gate (Bandit + ShellCheck + JS)
              - 🐛 SAST Analysis (Semgrep + ci-scan.sh)

              点击对应失败阶段查看详情，或前往 [流水线详情](${PIPELINE_URL}) 查看完整日志。"

              # 调用 Gitee API 发送 PR 评论
              if [ -n "${GITEE_TOKEN}" ]; then
                curl -s -X POST "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/pulls/${PR_NUMBER}/comments" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: token ${GITEE_TOKEN}" \
                  -d "$(python3 -c "
              import json
              print(json.dumps({'body': '''${COMMENT_BODY}'''}))
              " 2>/dev/null || echo "{\"body\": \"${COMMENT_BODY}\"}")"
                echo ""
                echo "✅ PR 失败通知已发送"
              else
                echo "⚠️  GITEE_TOKEN 未配置，跳过 PR 评论"
                echo "--- 评论预览 ---"
                echo "${COMMENT_BODY}"
              fi
            always: true

# ---------- 全局配置 ----------
config:
  # 失败快速退出: 任意阶段失败即停止后续
  fail-fast: false
  # 保留构建记录
  keep-days: 14
