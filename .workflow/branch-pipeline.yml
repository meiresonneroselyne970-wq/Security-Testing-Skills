version: '1.0'
name: branch-pipeline
displayName: BranchPipeline
stages:
  - stage:
    name: security-scan
    displayName: 安全扫描
    steps:
      - step: build@nodejs
        name: skill_security_scan
        displayName: Skill 安全扫描
        nodeVersion: 14
        commands:
          - chmod +x scripts/ci-scan.sh
          - bash scripts/ci-scan.sh
triggers:
  push:
    branches:
      exclude:
        - master
      include:
        - .*
