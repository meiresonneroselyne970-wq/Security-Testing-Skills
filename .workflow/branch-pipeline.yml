version: '1.0'
name: branch-pipeline
displayName: Branch安全扫描
triggers:
  push:
    branches:
      include:
        - .*
      exclude:
        - master
        - main
stages:
  - stage:
    name: security-scan
    displayName: 安全扫描
    steps:
      - step: build@python
        name: skill_scanner
        displayName: Skill安全扫描器
        pythonVersion: 3.11.0
        commands:
          - python3 --version
          - echo "=== 检查 bash ==="
          - which bash || which sh
          - echo "=== 检查 whitelist ==="
          - ls -la .security-whitelist.yml
          - echo "=== 开始扫描 ==="
          - bash scripts/security/ci-scan.sh --scope skills --scope .claude/skills --format json --output skill-security-report.json --fail-on-high
          - echo "扫描完成"
