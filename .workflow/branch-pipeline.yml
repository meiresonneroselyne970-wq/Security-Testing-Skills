version: '1.0'
name: branch-pipeline
displayName: Branch安全扫描
triggers:
  push:
    branches:
      include:
        - .*
      exclude:
        - master
        - main
stages:
  - stage:
    name: security-scan
    displayName: 安全扫描
    steps:
      - step: build@nodejs
        name: skill_scanner
        displayName: Skill安全扫描器
        nodeVersion: 14.16.0
        commands:
          - echo "=== 环境诊断 ==="
          - which bash && bash --version
          - ls -la .security-whitelist.yml
          - echo "=== 开始扫描 ==="
          - chmod +x scripts/security/ci-scan.sh
          - bash scripts/security/ci-scan.sh --scope skills --scope .claude/skills --format json --output skill-security-report.json --fail-on-high
          - echo "扫描完成"
