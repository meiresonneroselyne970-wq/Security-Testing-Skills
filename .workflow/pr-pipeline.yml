version: '1.0'
name: pr-pipeline
displayName: PR安全扫描
triggers:
  trigger: auto
  pr:
    branches:
      include:
        - master
        - main
stages:
  - name: security-scan
    displayName: 安全扫描
    steps:
      - step: build@nodejs
        name: skill_scanner
        displayName: Skill安全扫描器
        nodeVersion: 14.16.0
        commands:
          - echo "开始扫描 Skill 文件..."
          - chmod +x scripts/ci-scan.sh
          - bash scripts/ci-scan.sh --scope skills --scope .claude/skills --format json --output skill-security-report.json --strict
          - echo "扫描完成"
