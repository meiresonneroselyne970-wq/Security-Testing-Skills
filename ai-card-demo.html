<!DOCTYPE html>
<!--
  AI 卡片模板总览
  ──────────────
  3 种视觉模板，3 个文件夹，11 张卡片变体
    text-card     → 文本类（7 张）
    homework-card → 作业类（3 张）
    media-card    → 媒体类（1 张）
-->
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 卡片模板预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:24px}
h1{font-size:18px;font-weight:700;color:#111827;margin-top:4px}
.sub{font-size:12px;color:#9ca3af;text-align:center}
#root{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.wrap{display:flex;flex-direction:column;gap:6px;width:100%}
.label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;padding-left:4px}
.sec{font-size:13px;font-weight:700;color:#6b7280;padding:12px 0 0 4px;border-top:1px solid #e5e7eb;margin-top:12px;width:100%;max-width:400px}
.grid{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:400px}
/* 平板端 */
@media(min-width:480px){body{padding:28px 24px}.grid{max-width:440px}}
/* 大屏端 — 双列网格 */
@media(min-width:768px){h1{font-size:22px}.sub{font-size:13px}#root{align-items:stretch}.sec{max-width:none;font-size:14px}.grid{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.wrap{gap:4px}}
/* 电脑端 — 三列 */
@media(min-width:1024px){body{padding:36px 32px;gap:28px}.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
/* 电视端 — 四列 */
@media(min-width:1440px){body{padding:48px 40px;gap:32px}h1{font-size:26px}.sub{font-size:14px}.sec{font-size:15px}.grid{grid-template-columns:repeat(4,1fr);gap:28px}}
</style></head>
<body>
<h1>AI 卡片模板预览</h1>
<p class="sub">3 种视觉模板 · 每个文件夹独立的 CSS + JS + JSON · 双击任意 index.html 即可预览</p>
<div id="root" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>

<script src="text-card/ai-card.js"></script>
<script src="homework-card/ai-card.js"></script>
<script src="media-card/ai-card.js"></script>

<script>
var CARDS = [
  {folder:'text-card', group:'文本卡片', file:'h5-ai-assistant.json', data:{"schema_version":"1.0","card_type":"h5_entry","title":"炎图 AI 助手","subtitle":"我已加入当前聊天室","description":"可以为你提供智能协同服务，点击查看推荐内容。","button_text":"打开页面","target_url":"https://www.baidu.com","theme":"blue_white","layout":{"variant":"h5_entry","icon":"ai"}}},
  {folder:'text-card', group:'文本卡片', file:'h5-essay.json', data:{"schema_version":"1.0","card_type":"h5_entry","title":"作文范文：我的家乡","subtitle":"点击查看完整内容与老师点评","description":"三年级优秀作文展示，包含老师点评与修改建议。","button_text":"查看范文","target_url":"https://example.com/essay","theme":"blue_white","layout":{"variant":"h5_entry","icon":"link"}}},
  {folder:'text-card', group:'文本卡片', file:'edu-ai.json', data:{"schema_version":"1.0","card_type":"assistant_welcome","title":"教育 AI 助手","subtitle":"已就绪 · 随时为你服务","description":"我可以帮你完成：布置作业、批改作文、生成课程总结、回答学科问题。试试对我说「总结今天课程」吧！","button_text":"开始对话","target_url":"https://example.com/edu-ai","theme":"purple_white","layout":{"variant":"assistant_welcome","icon":"ai"}}},
  {folder:'text-card', group:'文本卡片', file:'medical-ai.json', data:{"schema_version":"1.0","card_type":"assistant_welcome","title":"医疗 AI 助手","subtitle":"已就绪 · 李医生随访团队","description":"我可以帮你：定时用药提醒、复诊预约、健康报告解读、饮食运动建议。对我说「今天药吃了吗」试试！","button_text":"开始对话","target_url":"https://example.com/medical-ai","theme":"emerald_white","layout":{"variant":"assistant_welcome","icon":"ai"}}},
  {folder:'text-card', group:'文本卡片', file:'oral-practice.json', data:{"schema_version":"1.0","card_type":"recommendation","title":"英语口语 · 餐厅点餐场景","subtitle":"根据你的学习进度智能推荐","description":"包含 12 组实用对话，覆盖点餐、结账、询问优惠等常见场景。AI 实时评分并给出改进建议。约 15 分钟 · 4.8 分 · 326 人练过。","button_text":"开始练习","target_url":"https://example.com/oral-practice","theme":"cyan_white","layout":{"variant":"recommendation","icon":"audio"}}},
  {folder:'text-card', group:'文本卡片', file:'weekly-report.json', data:{"schema_version":"1.0","card_type":"task","title":"班级群 · 教学周报汇总","subtitle":"由班主任发起 · 三年级组","description":"请各科老师在周五前提交本周教学周报（语文、数学、英语、科学），汇总后将统一发送至年级组存档。","button_text":"提交我的","target_url":"https://task.example.com/weekly-report","theme":"amber_white","layout":{"variant":"task","icon":"task"}}},
  {folder:'text-card', group:'文本卡片', file:'medication-reminder.json', data:{"schema_version":"1.0","card_type":"health_advice","title":"服药提醒 · 阿莫西林","subtitle":"医疗 AI 助手 · 李医生随访","description":"每日 3 次，每次 1 粒，饭后服用。请勿与牛奶同服，两次用药间隔至少 6 小时。本次疗程剩余 5 天，下次服药时间：今天 18:30。","button_text":"确认已服药","target_url":"https://health.example.com/medication/confirm","theme":"emerald_white","layout":{"variant":"health_advice","icon":"health"}}},
  {folder:'homework-card', group:'作业卡片', file:'chinese.json', data:{"schema_version":"1.0","card_type":"homework_reminder","title":"语文 · 阅读理解训练","subtitle":"张老师 · 三年级二班","description":"阅读课文《荷花》第2-4自然段，完成课后练习题第1-5题。重点体会作者对荷花的观察顺序和描写方法，用自己的话概括每段大意。","button_text":"查看作业","target_url":"https://homework.example.com/chinese","theme":"red_white","layout":{"variant":"homework_reminder","icon":"chinese"}}},
  {folder:'homework-card', group:'作业卡片', file:'math.json', data:{"schema_version":"1.0","card_type":"homework_reminder","title":"数学 · 第三章分数练习","subtitle":"王老师 · 三年级二班","description":"完成课本第42-44页练习题 1-15，重点练习分数加减法的通分与约分。要求写出完整计算过程，不可只写答案。","button_text":"查看作业","target_url":"https://homework.example.com/math","theme":"blue_white","layout":{"variant":"homework_reminder","icon":"math"}}},
  {folder:'homework-card', group:'作业卡片', file:'english.json', data:{"schema_version":"1.0","card_type":"homework_reminder","title":"英语 · Unit 5 My Day","subtitle":"李老师 · 三年级二班","description":"背诵 Unit 5 单词表（get up, breakfast, go to school 等 20 个词组），完成 Activity Book 第28-29页练习。录制一段「My Day」口语视频，不少于1分钟。","button_text":"查看作业","target_url":"https://homework.example.com/english","theme":"green_white","layout":{"variant":"homework_reminder","icon":"english"}}},
  {folder:'media-card', group:'媒体卡片', file:'class-video.json', data:{"schema_version":"1.0","card_type":"media_preview","title":"课堂录像 · 分数的加减法","subtitle":"42:18","description":"张老师 · 2026/05/24 上传 · MP4 · 1080p · 1.2 GB · 86 次观看。第三章重难点讲解，包含 5 道例题精讲与课堂互动问答环节。","button_text":"播放视频","target_url":"https://media.example.com/video/math-fraction","theme":"indigo_white","layout":{"variant":"media_preview","icon":"video"}}}
];

var groups = {};
CARDS.forEach(function(c) {
  if (!groups[c.group]) groups[c.group] = [];
  groups[c.group].push(c);
});

var r = document.getElementById('root');
Object.keys(groups).forEach(function(g) {
  var h = document.createElement('div'); h.className='sec'; h.textContent=g; r.appendChild(h);
  var grid = document.createElement('div'); grid.className='grid';
  groups[g].forEach(function(c) {
    var w = document.createElement('div'); w.className='wrap';
    var l = document.createElement('span'); l.className='label';
    l.textContent = c.folder+'/'+c.file+' · '+c.data.theme+' · icon='+c.data.layout.icon;
    w.appendChild(l);
    var el = document.createElement('ai-card'); el.setAttribute('data', JSON.stringify(c.data)); w.appendChild(el);
    grid.appendChild(w);
  });
  r.appendChild(grid);
});
</script>
</body></html>
