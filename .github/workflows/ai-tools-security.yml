name: AI Tools Execution Security Gate

on:
  pull_request:
    paths:
      - '.claude/skills/**/*.py'
      - 'cards/services/**/*.py'
      - 'skills/**/*.py'
      - 'cards/**/*.js'
      - 'skills/**/*.js'
      - 'scripts/**/*.sh'
      - 'skills/**/*.sh'
  push:
    branches: ['**']
    paths:
      - '.claude/skills/**/*.py'
      - 'cards/services/**/*.py'
      - 'skills/**/*.py'
      - 'cards/**/*.js'
      - 'skills/**/*.js'
      - 'scripts/**/*.sh'
      - 'skills/**/*.sh'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sast-code-execution:
    name: Restrict Dangerous System Calls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. Python 工具脚本：拦截高危模块
      # ==========================================
      - name: Run Bandit for Python Tools
        uses: PyCQA/bandit-action@v1
        with:
          targets: |
            .claude/skills/
            cards/services/
            skills/
          args: '-ll -ii -s B404,B602,B603'

      # ==========================================
      # 2. Node/JS 工具脚本：拦截子进程调用
      # ==========================================
      - name: Setup Node for JS Scan
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Custom AST Scan for JS
        run: |
          echo "🔍 Scanning JS files for prohibited system calls..."

          HAS_VIOLATION=0
          TARGET_DIRS=("skills" ".claude/skills" "cards")

          for dir in "${TARGET_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "  📂 Directory '$dir' not found, skipping."
              continue
            fi

            while IFS= read -r -d '' file; do
              if grep -Hn "child_process\|execSync\|spawnSync\|fork("  "$file" 2>/dev/null; then
                HAS_VIOLATION=1
              fi
            done < <(find "$dir" -name "*.js" -type f -print0 2>/dev/null)
          done

          if [ "$HAS_VIOLATION" -eq 1 ]; then
            echo ""
            echo "❌ SECURITY ALERT: Prohibited functions (child_process, execSync, spawnSync) found in JS tools!"
            echo "请使用 SandboxSDK 代替原生系统调用。"
            exit 1
          else
            echo "✅ JS Code Execution check passed."
          fi

      # ==========================================
      # 3. Bash 脚本：语法与安全漏洞扫描
      # ==========================================
      - name: ShellCheck for Bash Tools
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'scripts'
          severity: error

      # ==========================================
      # 4. PR 安全评论
      # ==========================================
      - name: Comment PR on Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **AI 工具执行安全审查未通过！**\n\n检测到高危系统调用（`subprocess`、`os.system`、`child_process` 等）或 Bash 语法错误。\n\n> ⚠️ 这些命令在 AI 自动执行场景下等同于 RCE。请改用 `SandboxSDK` 封装所有系统调用，并由安全负责人审批。\n\n📋 [查看运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
