name: AI Skills Security Gate

on:
  push:
    branches: ['**']
    paths:
      - 'skills/**'
      - '.claude/skills/**'
  pull_request:
    branches: [master]
    paths:
      - 'skills/**'
      - '.claude/skills/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: Skills Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 第一关：硬编码凭证扫描 (Secret Scanning)
      # ==========================================
      # 策略：计算 merge-base，仅扫描分支增量；若无法计算则全量扫描
      - name: Scan Secrets (TruffleHog)
        run: |
          set -e
          echo "🔑 正在扫描硬编码凭证..."

          # 安装 TruffleHog
          if command -v trufflehog &>/dev/null; then
            echo "  trufflehog 已安装"
          else
            echo "  安装 trufflehog..."
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          fi

          # 计算增量范围
          git fetch origin ${{ github.event.repository.default_branch }} --depth=100 2>/dev/null || true
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.event.repository.default_branch }} 2>/dev/null || echo "")

          if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "$(git rev-parse HEAD)" ]; then
            # 有明确的增量范围，仅扫描分支新增的 commit 变更
            echo "  扫描范围: $MERGE_BASE..HEAD"
            trufflehog git file://. --since-commit "$MERGE_BASE" --only-verified --fail
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            # 退化：扫描最近一次 commit 的变更
            echo "  扫描范围: HEAD~1..HEAD（仅最新 commit）"
            trufflehog git file://. --since-commit "HEAD~1" --only-verified --fail
          else
            # 仓库仅有一个 commit，全量扫描
            echo "  扫描范围: 全量扫描（仓库仅有一个 commit）"
            trufflehog filesystem --only-verified --fail ./
          fi

      # ==========================================
      # 第二关：工具脚本静态安全扫描 (SAST for Agent Tools)
      # ==========================================
      - name: Security Scan for Code Tools (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
          path: |
            skills/
            .claude/skills/

      # ==========================================
      # 第三关：提示词注入与越狱检测 (Prompt Integrity Check)
      # ==========================================
      - name: Setup Python for Prompt Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit Prompt Templates
        run: |
          cat << 'PYEOF' > audit_prompts.py
          import os
          import re
          import sys

          SUSPICIOUS_PATTERNS = [
              r"(?i)ignore\s*(all\s*)?previous\s*instructions",
              r"(?i)system\s*prompt\s*bypass",
              r"(?i)you\s*are\s*now\s*a\s*bypass",
              r"(?i)developer\s*mode\s*enabled",
              r"(?i)dump\s*(all\s*)?(previous\s*)?instructions",
              r"(?i)reveal\s*your\s*system\s*prompt",
              r"(?i)act\s*as\s*DAN\b",
              r"(?i)jailbreak",
              r"\bsudo\s+",
              r"curl\s+.*http",
              r"wget\s+.*http",
              r"eval\s*\(.*\)",
              r"exec\s*\(.*\)",
              r"__import__\s*\(.*\)",
              r"subprocess\.",
              r"os\.system\s*\(",
          ]

          WHITELIST_FILE = ".security-whitelist.yml"
          TARGET_DIRS = ["skills", ".claude/skills"]
          has_error = False

          # —— 加载白名单 ——
          file_whitelist = []
          pattern_whitelist = []
          if os.path.exists(WHITELIST_FILE):
              with open(WHITELIST_FILE, 'r', encoding='utf-8', errors='ignore') as wf:
                  content = wf.read()
              # 简单解析 YAML（不依赖 PyYAML）
              import re as _re
              in_files = False
              in_patterns = False
              for line in content.split('\n'):
                  stripped = line.strip()
                  if stripped.startswith('file_whitelist:'):
                      in_files, in_patterns = True, False
                      continue
                  if stripped.startswith('pattern_whitelist:'):
                      in_patterns, in_files = True, False
                      continue
                  if stripped.startswith('#') or stripped == '':
                      continue
                  if in_files and stripped.startswith('- '):
                      file_whitelist.append(stripped[2:].strip().strip('"').strip("'"))
                  if in_patterns and stripped.startswith('- '):
                      pattern_whitelist.append(stripped[2:].strip().strip('"').strip("'"))

          print(f"📋 Whitelist: {len(file_whitelist)} files, {len(pattern_whitelist)} patterns")
          for fw in file_whitelist:
              print(f"  📄 skip: {fw}")

          print("🔍 Starting Prompt Injection audit...")
          for skills_dir in TARGET_DIRS:
              if not os.path.exists(skills_dir):
                  print(f"  📂 Directory '{skills_dir}' not found, skipping.")
                  continue

              for root, _, files in os.walk(skills_dir):
                  for file in files:
                      if file.endswith(('.md', '.txt', '.json', '.yaml', '.yml', '.py', '.js', '.ts')):
                          file_path = os.path.join(root, file)

                          # 跳过白名单文件
                          rel_path = file_path.replace('\\', '/')
                          if any(rel_path == fw or rel_path.endswith('/' + fw) for fw in file_whitelist):
                              print(f"  ⏭️  Skipped (whitelist): {rel_path}")
                              continue

                          try:
                              with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                                  for suspect in SUSPICIOUS_PATTERNS:
                                      for m in _re.finditer(suspect, content):
                                          matched_line = content[max(0,m.start()-50):m.end()+50].split('\n')[0]
                                          # 跳过匹配行中含白名单模式的情况
                                          if any(pw.lower() in matched_line.lower() for pw in pattern_whitelist):
                                              continue
                                          print(f"❌ ALERT: Pattern '{m.group()}' found in {file_path}")
                                          has_error = True
                          except Exception as e:
                              print(f"⚠️  Could not read {file_path}: {e}")

          if has_error:
              print("\n🚨 Build blocked: Prompt injection or malicious payload detected!")
              sys.exit(1)
          else:
              print("\n✅ All prompt templates passed integrity checks.")
          PYEOF
          python audit_prompts.py

      # ==========================================
      # 第四关：PR 自动化安全反馈
      # ==========================================
      - name: Comment PR on Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **安全扫描未通过！**\n\n在你修改的 AI Skills 中发现了敏感凭证、高危脚本或疑似提示词注入攻击特征。\n\n请检查 [Actions 运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 并及时修正。'
            })
