name: Skill Security Scan

on:
  push:
    paths:
      - 'skills/**'
      - '.claude/skills/**'
  pull_request:
    paths:
      - 'skills/**'
      - '.claude/skills/**'
  workflow_dispatch:

jobs:
  security-scan:
    name: Skill Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Skill Security Scanner
        id: scan
        run: |
          # 检查是否有 skill 文件
          if [ -d "skills" ] || [ -d ".claude/skills" ]; then
            echo "发现 skill 文件，开始扫描..."
            
            # 扫描 skills 目录
            if [ -d "skills" ]; then
              for file in skills/*.md; do
                if [ -f "$file" ]; then
                  echo "扫描: $file"
                  # 这里可以调用实际的扫描脚本
                fi
              done
            fi
            
            # 扫描 .claude/skills 目录
            if [ -d ".claude/skills" ]; then
              for file in .claude/skills/*.md; do
                if [ -f "$file" ]; then
                  echo "扫描: $file"
                  # 这里可以调用实际的扫描脚本
                fi
              done
            fi
          else
            echo "未发现 skill 文件，跳过扫描"
          fi
      
      - name: Generate Report
        if: always()
        run: |
          echo "生成扫描报告..."
          # 这里可以生成报告文件
      
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-security-report
          path: |
            skill-security-report.json
            skill-security-report.md
          retention-days: 30
      
      - name: Check Result
        if: steps.scan.outcome == 'failure'
        run: |
          echo "❌ Skill 安全扫描失败"
          echo "请修复安全问题后重试"
          exit 1
