<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>炎图 AI 知识问答</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-layer"></div>

<div class="qa-card" id="qaCard">

  <div class="qa-card-header">
    <div class="qa-logo" id="qaLogo"></div>
    <h2 id="qaTitle"></h2>
    <p class="desc" id="qaSubtitle"></p>
  </div>

  <div class="qa-card-body" id="qaBody">
    <div class="qa-state" id="idleState">
      <span class="state-icon">💡</span>
      <p class="state-text">在下方输入问题，获取知识库中的答案</p>
      <p class="state-hint">支持自然语言提问</p>
    </div>
  </div>

  <div class="qa-card-footer">
    <div class="quick-prompts" id="quickPrompts"></div>
    <div class="input-row">
      <input type="text" id="qaInput" placeholder="" autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="api-status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">检测中…</span>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
