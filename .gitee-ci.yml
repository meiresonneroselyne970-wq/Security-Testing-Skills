# ============================================================
# AI DevSecOps Pipeline — Gitee Go 入口配置
# ============================================================
# 这是 Gitee 流水线的根配置文件，Gitee Go 自动检测此文件。
# 完整的工作流定义位于 .gitee/workflows/skill-security-scan.yml
#
# 如需使用高级版本（含并行阶段、制品上传、PR 通知），
# 请在 Gitee 流水线设置中指向 .gitee/workflows/skill-security-scan.yml
# ============================================================

# ---------- 全局镜像 ----------
image: python:3.10

# ---------- 缓存 ----------
cache:
  paths:
    - /root/.cache/pip

# ---------- 阶段定义 ----------
stages:
  - secrets-audit
  - prompt-security
  - execution-gate
  - sast-analysis
  - failure-notification

# ==========================================
# 1. 🔑 凭证泄漏扫描 (TruffleHog)
# ==========================================
secrets-audit:
  stage: secrets-audit
  image: python:3.10
  script:
    - echo "🔑 开始凭证泄漏扫描..."
    - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
    - |
      MERGE_BASE=$(git merge-base HEAD "origin/${CI_DEFAULT_BRANCH:-master}" 2>/dev/null || echo "")
      if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "$(git rev-parse HEAD)" ]; then
        echo "📌 增量扫描: $MERGE_BASE..HEAD"
        trufflehog git file://. --since-commit "$MERGE_BASE" --only-verified --fail --no-update
      else
        echo "📌 全量扫描"
        trufflehog git file://. --only-verified --fail --no-update
      fi
    - echo "✅ 凭证扫描通过"
  only:
    - main
    - master
    - byl-v1.0.0

# ==========================================
# 2. 💉 提示词注入与越狱审计
# ==========================================
prompt-security:
  stage: prompt-security
  image: python:3.10
  before_script:
    - echo "💉 开始提示词注入检测..."
  script:
    - python3 .gitee/scripts/audit_prompts.py
  only:
    - main
    - master
    - byl-v1.0.0

# ==========================================
# 3. 🛑 AI 工具沙箱执行门禁 (RCE 防御)
# ==========================================
execution-gate:
  stage: execution-gate
  image: python:3.10
  before_script:
    - echo "🛑 开始沙箱执行门禁扫描..."
    - apt-get update -qq && apt-get install -y -qq shellcheck 2>/dev/null || true
  script:
    # Python Bandit 扫描
    - echo "🛡️  Bandit: Python SAST..."
    - pip install bandit
    - bandit -r .claude/skills/ scripts/ -ll -ii -s B404,B602,B603
    # ShellCheck Bash 扫描
    - echo "🐚 ShellCheck: Bash 审计..."
    - |
      if command -v shellcheck &>/dev/null; then
        find scripts -name "*.sh" -type f -exec shellcheck --severity=error {} +
      else
        echo "⚠️  ShellCheck 不可用，跳过"
      fi
    # JS/Node 系统调用检查
    - echo "🔍 JS 系统调用检测..."
    - |
      DANGEROUS=$(find .claude/skills scripts -name "*.js" -type f -exec grep -lEn "child_process|execSync|spawnSync|fork\(" {} + 2>/dev/null || true)
      if [ -n "$DANGEROUS" ]; then
        echo "❌ SECURITY ALERT: Prohibited JS functions found!"
        echo "$DANGEROUS"
        exit 1
      fi
    - echo "✅ 沙箱执行门禁通过"
  only:
    - main
    - master
    - byl-v1.0.0

# ==========================================
# 4. 🐛 静态应用安全测试 (Semgrep & 内部脚本)
# ==========================================
sast-analysis:
  stage: sast-analysis
  image: python:3.10
  before_script:
    - echo "🐛 开始 SAST 分析..."
  script:
    # Semgrep 扫描
    - echo "🔍 Semgrep: 安全审计规则..."
    - pip install semgrep
    - semgrep scan --config "p/security-audit" --config "p/secrets" .claude/skills/ scripts/
    # 内部 ci-scan.sh T1-T7 扫描
    - echo "🔍 ci-scan.sh: T1-T7 威胁检测..."
    - chmod +x scripts/security/ci-scan.sh
    - bash scripts/security/ci-scan.sh --scope .claude/skills --scope scripts --format json --output skill-security-report.json --fail-on-high
    # 输出报告摘要
    - |
      if [ -f skill-security-report.json ]; then
        echo "📋 安全报告已生成:"
        python3 -m json.tool skill-security-report.json 2>/dev/null | head -80 || cat skill-security-report.json
      fi
  artifacts:
    paths:
      - skill-security-report.json
    expire_in: 14 days
  only:
    - main
    - master
    - byl-v1.0.0

# ==========================================
# 5. 🚨 失败通知 (PR 聚合通知)
# ==========================================
failure-notification:
  stage: failure-notification
  image: alpine:3.19
  when: on_failure
  script:
    - echo "🚨 安全门禁未通过"
    - |
      if [ -n "${GITEE_PR_NUMBER}" ] && [ -n "${GITEE_TOKEN}" ]; then
        apk add --no-cache curl
        curl -s -X POST \
          "https://gitee.com/api/v5/repos/${GITEE_REPO_OWNER:-blazegraph}/${GITEE_REPO_NAME:-card-template}/pulls/${GITEE_PR_NUMBER}/comments" \
          -H "Content-Type: application/json" \
          -H "Authorization: token ${GITEE_TOKEN}" \
          -d "{\"body\": \"🚨 **AI DevSecOps Pipeline Failed!**\n\n部分安全门禁未通过，请检查对应模块并修复：\n- 🔑 Secrets Scan\n- 💉 Prompt Injection Check\n- 🛑 Execution Sandbox Gate\n- 🐛 SAST Analysis\n\n📋 [查看流水线详情](https://gitee.com/${GITEE_REPO_OWNER:-blazegraph}/${GITEE_REPO_NAME:-card-template}/pipelines/${CI_PIPELINE_ID})\"}"
        echo "✅ PR 失败通知已发送"
      else
        echo "ℹ️  非 PR 事件或 GITEE_TOKEN 未配置，跳过通知"
      fi
  only:
    - main
    - master
    - byl-v1.0.0
