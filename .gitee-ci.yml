# ============================================================
# Gitee Go — Skill Security Scan Pipeline
# 版本: 1.0.0
# 用途: 自动扫描 skill 文件，检测恶意代码和安全威胁
#       危险 skill 自动阻止合并
# ============================================================

version: '1.0'

name: skill-security-scan
displayName: 🔒 Skill 安全扫描

# ============================================================
# 触发条件
# ============================================================
triggers:
  trigger: auto

  # Push 触发 — 仅 skill 文件变更时
  push:
    branches:
      include:
        - master
        - main
        - 'byl-.*'
        - 'dev.*'
        - 'feature/.*'
    paths:
      include:
        - 'skills/**'
        - '.claude/skills/**'
        - 'scripts/ci-scan.sh'
        - '.security-whitelist.yml'

  # PR 触发 — 合并前强制检查
  pr:
    branches:
      precise:
        - master
        - main
    paths:
      include:
        - 'skills/**'
        - '.claude/skills/**'
        - 'scripts/ci-scan.sh'

# ============================================================
# 环境变量
# ============================================================
variables:
  SCAN_SCOPE: 'skills .claude/skills'
  FAIL_MODE: '--fail-on-high'
  REPORT_FILE: 'skill-security-report.json'

# ============================================================
# 阶段定义
# ============================================================
stages:
  # ---------- 阶段 1：安全扫描 ----------
  - name: stage-scan
    displayName: 🔍 安全扫描
    strategy: naturally
    trigger: auto

    steps:
      # 步骤 1：执行安全扫描
      - step: build@shell
        name: security_scan
        displayName: 运行 Skill 安全扫描器
        commands:
          - echo "============================================="
          - echo "  Gitee Skill Security Scanner"
          - echo "  Branch: ${GITEE_BRANCH}"
          - echo "  Commit: ${GITEE_COMMIT}"
          - echo "  Trigger: ${GITEE_PIPELINE_TRIGGER_USER}"
          - echo "============================================="
          - echo ""
          # 确保脚本有执行权限
          - chmod +x scripts/ci-scan.sh
          # 执行扫描
          - |
            bash scripts/ci-scan.sh \
              --scope skills \
              --scope .claude/skills \
              --output "${REPORT_FILE}" \
              --format json \
              ${FAIL_MODE}
          - echo ""
          - echo "扫描完成，详细报告见 ${REPORT_FILE}"

      # 步骤 2：上传扫描报告
      - step: build@shell
        name: upload_report
        displayName: 📊 上传扫描报告
        if: always()
        commands:
          - echo "========== 扫描报告 =========="
          - if [ -f "${REPORT_FILE}" ]; then
          -   cat "${REPORT_FILE}"
          -   echo ""
          -   echo "报告文件: ${REPORT_FILE}"
          - else
          -   echo "未生成报告文件"
          - fi

  # ---------- 阶段 2：结果审查（仅在扫描通过时）----------
  - name: stage-verify
    displayName: ✅ 安全验证
    strategy: naturally
    trigger: auto

    steps:
      - step: build@shell
        name: verify_result
        displayName: 验证扫描结果
        commands:
          - echo "============================================="
          - echo "  Skill 安全扫描结果"
          - echo "============================================="
          - |
            if [ -f "${REPORT_FILE}" ]; then
              # 提取关键信息
              THREAT_SCORE=$(grep -oP '"ThreatScore":\s*\K\d+' "${REPORT_FILE}" 2>/dev/null || echo "0")
              RISK_LEVEL=$(grep -oP '"RiskLevel":\s*"\K[^"]+' "${REPORT_FILE}" 2>/dev/null || echo "Unknown")
              REVIEW=$(grep -oP '"ReviewStatus":\s*"\K[^"]+' "${REPORT_FILE}" 2>/dev/null || echo "Unknown")

              echo "  威胁分数: ${THREAT_SCORE}"
              echo "  风险等级: ${RISK_LEVEL}"
              echo "  审核状态: ${REVIEW}"

              case "${REVIEW}" in
                "Pass")
                  echo ""
                  echo "  ✅ 安全扫描通过"
                  echo "  没有检测到高危安全威胁"
                  ;;
                "Manual Review")
                  echo ""
                  echo "  ⚠️  需要人工审核"
                  echo "  检测到中危安全威胁，请审查后决定是否合并"
                  ;;
                "Reject")
                  echo ""
                  echo "  🚫 扫描被拒绝"
                  echo "  检测到严重安全威胁！此 PR 不能合并！"
                  echo "  请修复所有严重和高危威胁后重新提交"
                  ;;
              esac
            else
              echo "  ⚠️  未找到扫描报告文件"
            fi
          - echo "============================================="

# ============================================================
# 通知配置（可选）
# ============================================================
# 如需扫描失败时发送通知，可在 Gitee 仓库设置中配置 Webhook
# 或在以下添加通知步骤
