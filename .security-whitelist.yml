# Skill Security Scanner — Whitelist Configuration
# 安全扫描白名单配置
# Version: 1.0.0

# ============================================================
# 文件白名单（跳过扫描的文件）
# 匹配规则：相对于仓库根目录的路径，支持 glob 模式
# ============================================================
file_whitelist:
  # 测试文件 — 故意包含危险代码用于验证扫描器是否正常工作
  - "skills/test-dangerous.md"
  # 安全策略文档自身（包含安全威胁示例代码，非真实威胁）
  - "skill-security-solution.md"
  - "scripts/README.md"
  - ".claude/skills/security-audit.md"
  - ".claude/skills/skill-security-policy.md"
  - ".claude/skills/skill-security-scanner.md"

# ============================================================
# 模式白名单（匹配到的代码行将跳过检查）
# 适用于文档/注释中的示例代码
# ============================================================
pattern_whitelist:
  # 文档中的代码示例说明
  - "example|示例|demo|sample|template|文档|说明|注释|Example|Sample|Demo"
  # 调试日志
  - "console\.log"
  # 数学/时间函数
  - "Math\.random"
  - "Date\.now"

# ============================================================
# CDN 白名单（允许的外部脚本源）
# ============================================================
cdn_whitelist:
  - "cdnjs.cloudflare.com"
  - "unpkg.com"
  - "jsdelivr.net"
  - "cdn.jsdelivr.net"
  - "cdn.bootcdn.net"
  - "lib.baomitu.com"

# ============================================================
# 扫描范围
# ============================================================
scan_scope:
  include:
    - "skills/**/*.md"
    - ".claude/skills/**/*.md"
  exclude: []
