# Skill Security Scanner — 白名单配置
# 文档类 skill 文件包含代码示例是正常行为，加入白名单跳过扫描

file_whitelist:
  # skill-security-scanner: 安全检测规则定义文档，自身含威胁特征示例
  - ".claude/skill-security-skills/skill-security-scanner.md"
  # skill-security-policy: 安全策略文档，含检测规则说明
  - ".claude/skill-security-skills/skill-security-policy.md"
  # security-audit: 安全审计文档，含检测规则示例和威胁特征
  - ".claude/skill-security-skills/security-audit.md"
  # sandbox_sdk: 沙箱 SDK 本身封装 subprocess/os.system 并提供安全替代方案
  - "scripts/security/sandbox_sdk.py"
  # detection-test: 安全扫描器检测能力测试样本，含故意放置的 T1-T6 威胁模拟
  - "skills/detection-test.md"
  # sec-ignore-demo: sec-ignore 内联豁免功能演示，含带豁免注释的威胁样本
  - "skills/sec-ignore-demo.md"

pattern_whitelist:
  - "示例"
  - "example"
  - "placeholder"
  - "代码示例"
  - "威胁特征"
